
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Amigo Secreto 2026</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8eee9;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #254c39;
    }
    main {
      background: white;
      padding: 35px 25px;
      margin: 20px;
      border-radius: 24px;
      box-shadow: 0 8px 25px #00000015;
      max-width: 400px;
    }
    h1 { font-size: 32px; }
    p { line-height: 1.6; }
    .regalo { font-size: 65px; }
    .aviso {
      background: #f8eee9;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <div class="regalo">🎁</div>
    <h1>Amigo Secreto 2026</h1>
    <p>¡La magia de la Navidad comienza aquí!</p>
    <p>
      Cada participante descubrirá
      sus 3 amigos secretos.
    </p>
    <div class="aviso">
      🔐 Estamos preparando el sorteo.
      Pronto podrás ingresar con
      tu invitación privada.
    </div>
    <p>🎄 ¡Que comience la magia! 🎄</p>
  </main>
</body>
</html>
